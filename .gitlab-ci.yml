default:
  image: oven/bun@sha256:c017a211c49a21adc0e49dda7b60ac8112887c3d9465e01427f434ed107c830e
  interruptible: true

# Merge-request gate only. A push to main does not create a pipeline and
# does not deploy. Workers Builds ships the three workers. Xcode Cloud
# builds iOS. This file is the check Billy uses before a bot merges.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "cursor/ios-1-6-app-store-screenshots-9566"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - install
  - test

variables:
  BUN_INSTALL_CACHE_DIR: ".bun-install-cache"

.gate:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
  needs:
    - job: install
      artifacts: true
  cache: []

install:
  stage: install
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
      prefix: bun-1.4.3
    paths:
      - .bun-install-cache/
    policy: pull-push
  script:
    - bun scripts/ci-install-node.ts
    # Node.js v22.23.5 linux-x64 sha256 c54118104acc524633b5abe106bbf44a53126ec8b4e5fa105cb92b5d7de8a1a1
    - tar -xzf node-v22.23.5-linux-x64.tar.gz
    - rm node-v22.23.5-linux-x64.tar.gz
    - mv node-v22.23.5-linux-x64 .node
    - bun install --frozen-lockfile --ignore-scripts
  artifacts:
    paths:
      - node_modules/
      - .node/
    expire_in: 1 hour

lint:
  extends: .gate
  script:
    # Safe fixes (format, import order) apply in the job workspace.
    # bun run lint is the gate and must exit 0. Warnings do not fail it.
    - bunx biome check --write .
    - bun run lint

typecheck:
  extends: .gate
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$CI_PROJECT_DIR/node_modules/.bin:$PATH"
    - node --version
    - wrangler types
    - react-router typegen
    - tsc -b

unit:
  extends: .gate
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    - node --run test:unit

flag-check:
  extends: .gate
  script:
    - bun run flag:check

e2e:
  extends: .gate
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.playwright-browsers
  cache:
    key:
      files:
        - bun.lock
      prefix: playwright-chromium
    paths:
      - .playwright-browsers/
    policy: pull-push
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    - bunx playwright install --with-deps chromium
    - bun run test:e2e

# Operator sync for the Copilot docs corpus. Not part of the merge gate.
# The workflow creates merge-request pipelines only, and this rule keeps
# the job out of those pipelines. Run the script by hand outside this gate.
ai_search_sync:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - |
      for file in $(find docs/fin content/blog docs/dev docs/legal docs/mcp -type f \( -name '*.md' -o -name '*.mdx' \)); do
        bunx wrangler r2 object put "ration-copilot-docs/${file}" --file "$file" --remote
      done
      bunx wrangler r2 object put "ration-copilot-docs/README.md" --file "README.md" --remote
    - bunx wrangler ai-search jobs create ration-docs
  allow_failure: false

# One-shot for the iOS 1.6 screenshot branch. It commits the frames, then
# restores this file from main so the job does not stay on the branch.
assemble-1-6-frames:
  stage: install
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "cursor/ios-1-6-app-store-screenshots-9566" && $CI_PIPELINE_SOURCE == "push"
  interruptible: false
  script:
    - apk add --no-cache git curl python3
    - |
      set -eu
      DEST="marketing/appstore/uk/framed/6.9/1.6"
      BASE="https://gitlab.com/bjamesdowning/ration/-/raw/cursor/ios-1-6-screenshot-ferry-9566/export/appstore-1.6"
      mkdir -p "$DEST"
      for f in 01-daily-fuel.png 02-agent-sets-fuel.png 03-import.png 04-scan.png 05-galley.png 06-manifest.png 07-supply.png 08-your-agent.png; do
        curl -fsSL "$BASE/$f" -o "$DEST/$f"
      done
      python3 - <<'PY'
      import pathlib, struct
      expected = {
          "01-daily-fuel.png": 276013,
          "02-agent-sets-fuel.png": 448017,
          "03-import.png": 1725193,
          "04-scan.png": 420458,
          "05-galley.png": 232013,
          "06-manifest.png": 248242,
          "07-supply.png": 331932,
          "08-your-agent.png": 117323,
      }
      root = pathlib.Path("marketing/appstore/uk/framed/6.9/1.6")
      for name, size in expected.items():
          data = (root / name).read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", name
          w, h = struct.unpack(">II", data[16:24])
          assert (w, h) == (1320, 2868), (name, w, h)
          assert len(data) == size, (name, len(data), size)
          print(name, w, h, len(data))
      PY
      git fetch origin main
      git show origin/main:.gitlab-ci.yml > /tmp/gitlab-ci.main.yml
      python3 - <<'PY'
      import base64, json, os, pathlib, urllib.request
      root = pathlib.Path("marketing/appstore/uk/framed/6.9/1.6")
      actions = []
      for path in sorted(root.glob("*.png")):
          actions.append({
              "action": "create",
              "file_path": str(path),
              "encoding": "base64",
              "content": base64.b64encode(path.read_bytes()).decode(),
          })
      actions.append({
          "action": "update",
          "file_path": ".gitlab-ci.yml",
          "encoding": "text",
          "content": pathlib.Path("/tmp/gitlab-ci.main.yml").read_text(),
      })
      payload = {
          "branch": os.environ["CI_COMMIT_BRANCH"],
          "commit_message": "Add the iOS 1.6 App Store 6.9-inch screenshot set\n\nEight 1320x2868 frames in marketing/appstore/uk/framed/6.9/1.6, in upload order.",
          "actions": actions,
      }
      url = os.environ["CI_API_V4_URL"] + "/projects/" + os.environ["CI_PROJECT_ID"] + "/repository/commits"
      data = json.dumps(payload).encode()
      names = sorted(k for k in os.environ if "TOKEN" in k or k.startswith("CI_"))
      print("env", ",".join(names))
      req = urllib.request.Request(
          url,
          data=data,
          method="POST",
          headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"], "Content-Type": "application/json"},
      )
      try:
          with urllib.request.urlopen(req, timeout=180) as response:
              body = response.read().decode()
              print(response.status, body[:400])
      except Exception as exc:
          detail = exc.read().decode() if hasattr(exc, "read") else str(exc)
          print("commit API failed", getattr(exc, "code", ""), detail[:1500])
          raise SystemExit(1)
      PY
