# Manual: upload docs corpus to R2 and reindex Copilot AI Search.
# Trigger after docs/fin, docs/dev, docs/legal, content/blog, or README changes.
# Requires CLOUDFLARE_API_TOKEN (and account) with R2 + AI Search write access.
# `ai-search jobs` needs Wrangler ≥ 4.112.0 (resolved from package.json / bun.lock).
ai_search_sync:
  stage: verify
  rules:
    - when: manual
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - |
      for file in $(find docs/fin content/blog docs/dev docs/legal -type f \( -name '*.md' -o -name '*.mdx' \)); do
        bunx wrangler r2 object put "ration-copilot-docs/${file}" --file "$file" --remote
      done
      bunx wrangler r2 object put "ration-copilot-docs/README.md" --file "README.md" --remote
    - bunx wrangler ai-search jobs create ration-docs
  allow_failure: false

# Branch-only. Removed before merge so main stays on the manual ai_search_sync job.
verify_fuel_manifest:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "cursor/fuel-manifest-load-296c"
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - bun run build
    - |
      curl -fsSL https://nodejs.org/dist/v22.22.0/node-v22.22.0-linux-x64.tar.gz -o /tmp/node.tar.gz
      tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
      node ./node_modules/wrangler/bin/wrangler.js types
      bunx react-router typegen
      bunx tsc -b
    - bun run test:unit
    - bun run flag:check
  allow_failure: false

d1_migrate_prod:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "cursor/fuel-manifest-load-296c"
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - bunx wrangler d1 migrations apply DB --remote
  allow_failure: false
