image: oven/bun:1

# Most CI jobs are commented out to conserve GitLab CI minutes.
# Re-enable SAST, install, lint, typecheck, and unit tests when minutes allow.
# Deploy stage was already disabled; Workers Builds / manual deploy remain the path to production.
#
# include:
#   - component: $CI_SERVER_FQDN/components/sast/sast@3.4.0

stages:
  - test
  - install
  - verify
  #- deploy

variables:
  BUN_INSTALL_CACHE_DIR: ".bun-install-cache"

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/
    - .bun-install-cache/

# Required local-quality gate (re-enabled for nutrition hardening).
# Workers Builds remains the production deploy path; this job must not allow_failure.
verify:
  stage: verify
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - bun run cf-typegen
    - bun run lint
    - bun run typecheck
    - bun run test:unit
    - bun run flag:check
  allow_failure: false

# Manual: upload docs corpus to R2 and reindex Copilot AI Search.
# Trigger after docs/fin, docs/dev, docs/legal, content/blog, or README changes.
# Requires CLOUDFLARE_API_TOKEN (and account) with R2 + AI Search write access.
# `ai-search jobs` needs Wrangler ≥ 4.112.0 (resolved from package.json / bun.lock).
ai_search_sync:
  stage: verify
  rules:
    - when: manual
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - |
      for file in $(find docs/fin content/blog docs/dev docs/legal -type f \( -name '*.md' -o -name '*.mdx' \)); do
        bunx wrangler r2 object put "ration-copilot-docs/${file}" --file "$file" --remote
      done
      bunx wrangler r2 object put "ration-copilot-docs/README.md" --file "README.md" --remote
    - bunx wrangler ai-search jobs create ration-docs
  allow_failure: false
