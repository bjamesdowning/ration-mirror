default:
  image: oven/bun@sha256:c017a211c49a21adc0e49dda7b60ac8112887c3d9465e01427f434ed107c830e
  interruptible: true

# Merge-request gate only. A push to main does not create a pipeline and
# does not deploy. Workers Builds ships the three workers. Xcode Cloud
# builds iOS. This file is the check Billy uses before a bot merges.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - install
  - test

variables:
  BUN_INSTALL_CACHE_DIR: ".bun-install-cache"

.gate:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
  needs:
    - job: install
      artifacts: true
  cache: []

install:
  stage: install
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
      prefix: bun-1.4.3
    paths:
      - .bun-install-cache/
    policy: pull-push
  script:
    - bun scripts/ci-install-node.ts
    # Node.js v22.23.5 linux-x64 sha256 c54118104acc524633b5abe106bbf44a53126ec8b4e5fa105cb92b5d7de8a1a1
    - tar -xzf node-v22.23.5-linux-x64.tar.gz
    - rm node-v22.23.5-linux-x64.tar.gz
    - mv node-v22.23.5-linux-x64 .node
    - bun install --frozen-lockfile --ignore-scripts
  artifacts:
    paths:
      - node_modules/
      - .node/
    expire_in: 1 hour

lint:
  extends: .gate
  script:
    # Safe fixes (format, import order) apply in the job workspace.
    # bun run lint is the gate and must exit 0. Warnings do not fail it.
    - bunx biome check --write .
    - bun run lint

typecheck:
  extends: .gate
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$CI_PROJECT_DIR/node_modules/.bin:$PATH"
    - node --version
    - wrangler types
    - react-router typegen
    - tsc -b

unit:
  extends: .gate
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    - node --run test:unit

flag-check:
  extends: .gate
  script:
    - bun run flag:check

e2e:
  extends: .gate
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.playwright-browsers
  cache:
    key:
      files:
        - bun.lock
      prefix: playwright-chromium
    paths:
      - .playwright-browsers/
    policy: pull-push
  script:
    - export PATH="$CI_PROJECT_DIR/.node/bin:$PATH"
    - bunx playwright install --with-deps chromium
    - bun run test:e2e

# Operator sync for the Copilot docs corpus. Not part of the merge gate.
# The workflow creates merge-request pipelines only, and this rule keeps
# the job out of those pipelines. Run the script by hand outside this gate.
ai_search_sync:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
  script:
    - bun install --frozen-lockfile --ignore-scripts
    - |
      for file in $(find docs/fin content/blog docs/dev docs/legal docs/mcp -type f \( -name '*.md' -o -name '*.mdx' \)); do
        bunx wrangler r2 object put "ration-copilot-docs/${file}" --file "$file" --remote
      done
      bunx wrangler r2 object put "ration-copilot-docs/README.md" --file "README.md" --remote
    - bunx wrangler ai-search jobs create ration-docs
  allow_failure: false

# One-shot. Downloads the corrected 6.9 frames and commits them, then
# restores this file to main so the job does not stay on the branch.
assemble-1-6-frames:
  stage: test
  image: python:3.12-alpine
  needs: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      python3 << 'PY'
      import base64, json, os, struct, urllib.error, urllib.request

      token = os.environ["GROUP_API_TOKEN"]
      project = os.environ["CI_PROJECT_ID"]
      branch = os.environ["CI_COMMIT_REF_NAME"]
      api = "https://gitlab.com/api/v4"
      base = "https://gitlab.com/bjamesdowning/ration/-/raw/cursor/ios-1-6-frame-ferry-9566/marketing/appstore/uk/framed/6.9/1.6"
      files = {
          "marketing/appstore/uk/framed/6.9/1.6/02-agent-sets-fuel.png": 458012,
          "marketing/appstore/uk/framed/6.9/1.6/06-manifest.png": 365629,
          "marketing/appstore/uk/framed/6.9/1.6/07-supply.png": 306757,
          "marketing/appstore/uk/framed/6.9/1.6/08-hub.png": 344673,
      }

      def fetch(url, auth=False):
          req = urllib.request.Request(url)
          if auth:
              req.add_header("PRIVATE-TOKEN", token)
          with urllib.request.urlopen(req, timeout=120) as resp:
              return resp.read()

      def check_png(data, size, name):
          if len(data) != size or data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit(f"bad bytes {name} {len(data)}")
          width, height, bit, color = struct.unpack(">IIBB", data[16:26])
          if (width, height, bit, color) != (1320, 2868, 8, 2):
              raise SystemExit(f"bad png {name} {(width, height, bit, color)}")
          print("ok", name, size)

      actions = []
      for path, size in files.items():
          name = path.rsplit("/", 1)[-1]
          data = fetch(f"{base}/{name}")
          check_png(data, size, name)
          actions.append({
              "action": "create" if name == "08-hub.png" else "update",
              "file_path": path,
              "content": base64.b64encode(data).decode(),
              "encoding": "base64",
          })
      actions.append({
          "action": "delete",
          "file_path": "marketing/appstore/uk/framed/6.9/1.6/08-your-agent.png",
      })
      yml = fetch(f"{api}/projects/{project}/repository/files/.gitlab-ci.yml/raw?ref=main", auth=True)
      if b"assemble-1-6-frames" in yml:
          raise SystemExit("main ci still contains the one-shot job")
      actions.append({"action": "update", "file_path": ".gitlab-ci.yml", "content": yml.decode()})
      body = json.dumps({
          "branch": branch,
          "commit_message": "Correct the iOS 1.6 App Store frames\n\nSlide 2 names the agents in type. Slide 6 uses the current Manifest. Slide 7 adds the saved-lists cutout. Slide 8 is the Hub screen.\n",
          "actions": actions,
      }).encode()
      req = urllib.request.Request(
          f"{api}/projects/{project}/repository/commits",
          data=body,
          method="POST",
          headers={"PRIVATE-TOKEN": token, "Content-Type": "application/json"},
      )
      try:
          with urllib.request.urlopen(req, timeout=180) as resp:
              print("commit", resp.status)
      except urllib.error.HTTPError as exc:
          detail = exc.read()[:1500]
          print("commit failed", exc.code, detail.decode("utf-8", "replace"))
          raise
      PY
